unbind C-b
set -g prefix `
bind-key ` last-window
bind-key e send-prefix

bind | split-window -h
bind - split-window -v

# Tiled layout (4 panes -> 2x2); stands in for M-5, which Option+5 doesn't send on macOS
bind T select-layout tiled
# Pull another window into this one as a pane (pick it from a list)
bind j choose-tree -Zw "join-pane -h -s '%%'"
# Swap current pane with another window (pick it from a list); the old pane takes that window's place
bind S choose-tree -Zw "swap-pane -s '%%'"

# Show a label on each pane's top border: its name if set, else the running command
# (Claude Code's process name is its version number, so show its session title instead)
set -g pane-border-status top
set -g pane-border-format ' #{?@name,#{@name},#{?#{m/r:^[0-9.]+$,#{pane_current_command}},#{pane_title},#{pane_current_command}}} '
# Name the current pane
bind N command-prompt -p "pane name:" "set -p @name '%%'"

bind R run-shell 'cmd=$(tmux capture-pane -p -S - | grep -oE "claude --resume [a-f0-9-]+" | tail -1); [ -n "$cmd" ] && tmux send-keys "$cmd" Enter'

set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour137
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241,bold] #(TZ=Europe/Amsterdam date "+%d/%m #[fg=colour233,bg=colour245,bold]%H:%M:%S %Z") '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-format '#{?@claude_waiting,#[fg=colour231#,bg=colour166#,bold] #I:#W#F ,#[default] #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F }'

setw -g monitor-activity off
set -g visual-activity off
set -g activity-action none
setw -g window-status-activity-style 'fg=colour231,bg=colour166,bold'

# Clear Claude waiting indicator when visiting a window
set-hook -g session-window-changed 'set-option -quw @claude_waiting'
set-hook -g after-select-window 'set-option -quw @claude_waiting'

set-option -g history-limit 5000
set -g mouse on
set-environment -g TZ "Europe/Amsterdam"

set -g focus-events on

# Let escape sequences from inside tmux reach the outer terminal.
# Required for Cmd+click on links (OSC 8) inside Claude Code, image
# protocols (Kitty/iTerm/Sixel), and other terminal-aware programs.
set -g allow-passthrough on
# Advertise OSC 8 hyperlink support for Ghostty so tmux forwards clickable links.
set -as terminal-features ",xterm-ghostty:hyperlinks"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'Subbeh/tmux-tpad'
set -g @plugin 'sainnhe/tmux-fzf'

# tpad popups
set -g @tpad-scratchpad-bind "C-p"
set -g @tpad-scratchpad-dir "#{pane_current_path}"

set -g @tpad-git-bind "C-g"
set -g @tpad-git-cmd "lazygit"
set -g @tpad-git-per-dir "true"

# Move current window to another session via fzf
bind M run-shell "tmux list-sessions -F '##S' | grep -v \"^$(tmux display-message -p '##S')\\$\" | fzf-tmux -p --prompt='Move window to: ' | xargs -I{} tmux move-window -t '{}:'"

# Session Radar: fuzzy-jump to any Claude Code session (prefix+g)
bind g display-popup -E -w 90% -h 80% "uv run python ~/claude/session-radar/session_radar.py --jump"
# Session Radar: export the prefix+g view to ~/.claude/session-radar/jump.md and copy the path (prefix+G)
bind G run-shell "uv run python ~/claude/session-radar/session_radar.py --export 2>/dev/null; printf '%s' ~/.claude/session-radar/jump.md | pbcopy; tmux display-message 'Session radar exported to ~/.claude/session-radar/jump.md (path copied)'"

set -g @continuum-restore 'on'
# Continuum's own autosave is disabled; ~/.tmux/autosave.sh saves every 5 min instead (see below tpm).
set -g @continuum-save-interval '0'

# Park before reboot (prefix+P): gracefully exit every Claude/Codex pane and
# record pane -> (cwd, session id); after continuum restores the layout, the
# post-restore hook relaunches `cd <cwd> && claude --resume <id>` in each pane.
bind P confirm-before -p "Park all Claude/Codex sessions for reboot? (y/n)" { display-popup -E -w 90% -h 80% "uv run python ~/claude/session-radar/park.py park; echo; echo 'Press Enter to close'; read _" }
set -g @resurrect-hook-post-restore-all 'tmux run-shell -b "uv run python ~/claude/session-radar/park.py restore --auto"'
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'

# Continuum injects #(continuum_save.sh) into status-right, which forks on every
# status redraw (~7/s with many panes). Reset status-right without it and autosave
# on a 5-minute timer instead. Restore-on-start is unaffected.
set -g status-right '#[fg=colour233,bg=colour241,bold] #(TZ=Europe/Amsterdam date "+%d/%m #[fg=colour233,bg=colour245,bold]%H:%M:%S %Z") '
run-shell -b '~/.tmux/autosave.sh 300'

# Reorder windows: prefix m, arrow to a window, Enter -> current window is inserted before it
bind m run-shell "tmux choose-tree -w -Z -f '##{==:##{session_name},#{session_name}}' \"move-window -s #{window_id} -b -t '%%'\""
