unbind C-b
set -g prefix `
bind-key ` last-window
bind-key e send-prefix

bind | split-window -h
bind - split-window -v

bind R run-shell 'cmd=$(tmux capture-pane -p -S - | grep -oE "claude --resume [a-f0-9-]+" | tail -1); [ -n "$cmd" ] && tmux send-keys "$cmd" Enter'

set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour137
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241,bold] #(TZ=Europe/Amsterdam date "+%d/%m #[fg=colour233,bg=colour245,bold]%H:%M:%S %Z") '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-format '#{?@claude_waiting,#[fg=colour231#,bg=colour166#,bold] #I:#W#F ,#[default] #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F }'

setw -g monitor-activity off
set -g visual-activity off
set -g activity-action none
setw -g window-status-activity-style 'fg=colour231,bg=colour166,bold'

# Clear Claude waiting indicator when visiting a window
set-hook -g session-window-changed 'set-option -quw @claude_waiting'
set-hook -g after-select-window 'set-option -quw @claude_waiting'

set-option -g history-limit 5000
set -g mouse on
set-environment -g TZ "Europe/Amsterdam"

set -g focus-events on

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'Subbeh/tmux-tpad'
set -g @plugin 'sainnhe/tmux-fzf'

# tpad popups
set -g @tpad-scratchpad-bind "C-p"
set -g @tpad-scratchpad-dir "#{pane_current_path}"

set -g @tpad-git-bind "C-g"
set -g @tpad-git-cmd "lazygit"
set -g @tpad-git-per-dir "true"

# Move current window to another session via fzf
bind M run-shell "tmux list-sessions -F '##S' | grep -v \"^$(tmux display-message -p '##S')\\$\" | fzf-tmux -p --prompt='Move window to: ' | xargs -I{} tmux move-window -t '{}:'"

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
